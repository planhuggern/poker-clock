# Docker Compose for poker-clock-portalen.
# Foreløpig kun Postgres-tjenesten; appene legges til etter hvert.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokerclock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokerclock}
      POSTGRES_DB: ${POSTGRES_DB:-pokerclock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
